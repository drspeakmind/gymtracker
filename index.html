// ============================================================
//  ADD SET MODAL  (the fast-entry heart of the app)
// ============================================================
// last straight set (circuit sets are kept out of exercise history on purpose)
function lastSet(exId, person, scheme) {
  const all = DB.Sets.filter(s => s.exerciseId === exId && s.person === person && !s.deleted && !s.circuitId
      && (scheme === undefined || Number(s.scheme) === Number(scheme)))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  return all[0];
}

// A stored set <-> the "values" object the entry controls edit. Shared by the
// normal Add Set flow and by circuit stations.
function defaultVals(exr) {
  const t = exr.weightType;
  if (t === 'sprint') return { duration: 15, rest: 30, number: 4 };
  if (isBodyweight(t)) return { weight: 0, reps: isTimed(t) ? 30 : 10, loadType: 'plate' };
  if (isCardio(t)) return Object.assign({ durMin: 10, durSec: 0, setting: 1 }, hasGradient(t) ? { gradient: 0 } : {});
  return { weight: defaultWeight(exr), reps: 10 };
}
function valsFromSet(exr, s) {
  const t = exr.weightType;
  if (t === 'sprint') return { duration: Number(s.duration) || 15, rest: Number(s.rest) || 30, number: Number(s.number) || 4 };
  if (isBodyweight(t)) return { weight: Number(s.weight) || 0, reps: Number(s.reps) || 0, loadType: 'plate' };
  if (isCardio(t)) {
    const d = Number(s.duration) || 0;
    return Object.assign({ durMin: Math.floor(d / 60), durSec: d % 60, setting: Number(s.weight) || 0 }, hasGradient(t) ? { gradient: Number(s.gradient) || 0 } : {});
  }
  return { weight: Number(s.weight) || 0, reps: Number(s.reps) || 0 };
}
// fill in the stored fields for a set from entry values; base carries id/workout/person/ts/etc.
function buildSetRow(exr, v, base) {
  const t = exr.weightType;
  if (t === 'sprint') return Object.assign(base, { scheme: '', weight: 0, reps: 0,
    duration: Math.round(v.duration), rest: Math.round(v.rest), number: Math.round(v.number) });
  if (isBodyweight(t)) return Object.assign(base, { scheme: '', weight: round2(v.weight), reps: Math.round(v.reps) });
  if (isCardio(t)) return Object.assign(base, { scheme: '', weight: round2(v.setting), reps: 0,
    duration: Math.max(0, Math.round(v.durMin)) * 60 + Math.max(0, Math.round(v.durSec)) },
    hasGradient(t) ? { gradient: round2(v.gradient) } : {});
  return Object.assign(base, { scheme: base.scheme === undefined ? '' : base.scheme, weight: round2(v.weight), reps: Math.round(v.reps) });
}

// ============================================================
//  PROGRESSION HINTS — double progression inside a rep range.
//  Stay at a weight until EVERY set reaches the top of the range, then step up.
//  Only suggestions: nothing is forced, and past schemes are left untouched.
// ============================================================
function epley(w, r) { return Number(w) * (1 + Number(r) / 30); }
function hintable(exr) { return !!exr && ['plate', 'machine', 'dumbbell', 'kettlebell', 'bodyweight'].indexOf(exr.weightType) !== -1; }
// "62.5 kg", or for bodyweight moves "bodyweight" / "BW + 5 kg" (the weight is the load added)
function loadText(exr, w) {
  if (exr.weightType === 'bodyweight') return Number(w) > 0 ? 'BW + ' + fmtNum(w) + ' kg' : 'bodyweight';
  return fmtNum(w) + ' kg';
}

// one person's working sets for an exercise, grouped into sessions (oldest first)
function personSessions(exId, person, excludeWid, filter) {
  const by = {};
  DB.Sets.forEach(s => {
    if (s.exerciseId !== exId || s.person !== person || s.deleted || s.warmup || s.circuitId) return;
    if (excludeWid && s.workoutId === excludeWid) return;
    const wk = workoutById(s.workoutId); if (!wk || wk.deleted) return;
    if (!(Number(s.reps) > 0)) return;
    if (filter && !filter(s)) return;
    (by[s.workoutId] = by[s.workoutId] || []).push(s);
  });
  return Object.keys(by).map(wid => ({ wid: wid, date: workoutDate(by[wid][0]), sets: by[wid].sort((a, b) => (a.ts || 0) - (b.ts || 0)) }))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.sets[0].ts || 0) - (b.sets[0].ts || 0));
}
// round a calculated weight to something the equipment can actually do
function roundToStep(exr, w) {
  const t = exr.weightType;
  if (t === 'dumbbell') return nearest(DUMBBELLS, w);
  if (t === 'kettlebell') return nearest(KETTLEBELLS, w);
  if (t === 'machine') return Math.max(0, Math.round(w * 2) / 2);
  const st = Number(exr.step) || 2.5;
  return Math.max(st, Math.round(w / st) * st);
}
// the next step up: smallest add-on on machines, next size for DB/KB, less assistance when inverted
function nextWeight(exr, w) {
  const t = exr.weightType;
  if (exr.inverted) return Math.max(0, round2(w - (Number(exr.step) || 5)));
  if (t === 'dumbbell') return DUMBBELLS.find(x => x > w) || w;
  if (t === 'kettlebell') return KETTLEBELLS.find(x => x > w) || w;
  if (t === 'machine') return round2(w + MACHINE_ADDONS[0]);
  return round2(w + (Number(exr.step) || 2.5));
}
// -> { state: 'ready' | 'hold' | 'low' | 'start', weight, last?, minReps?, from? } or null
// range = { lo, hi } for this exercise (a routine can set its own); defaults to the 8–10 programme
function progressionHint(exr, person, excludeWid, range) {
  if (!hintable(exr)) return null;
  range = range || PROGRAM;
  // bodyweight moves have no rep scheme, so all their sets count
  const cur = personSessions(exr.id, person, excludeWid, s => exr.weightType === 'bodyweight' || Number(s.scheme) === PROGRAM.scheme);
  if (cur.length) {
    const last = cur[cur.length - 1];
    const ws = last.sets.map(s => Number(s.weight));
    const ref = exr.inverted ? Math.min.apply(null, ws) : Math.max.apply(null, ws);   // the working weight
    const reps = last.sets.filter(s => Number(s.weight) === ref).map(s => Number(s.reps));
    const minReps = Math.min.apply(null, reps);
    const info = { last: { weight: ref, reps: reps, date: last.date }, minReps: minReps };
    if (reps.length >= 2 && minReps >= range.hi) return Object.assign(info, { state: 'ready', weight: nextWeight(exr, ref) });
    if (minReps < range.lo) return Object.assign(info, { state: 'low', weight: ref });
    return Object.assign(info, { state: 'hold', weight: ref });
  }
  // nothing at the new range yet: estimate a starting weight from the last two sessions at any range
  // (not for assisted moves, or bodyweight moves where the weight is only an added load)
  if (exr.inverted || exr.weightType === 'bodyweight') return null;
  const target = range.lo;   // reps the estimate is aimed at: the bottom of the range, so day one is a solid 8
  const startFor = (p, label) => {
    let best = null;
    personSessions(exr.id, p, excludeWid).slice(-2).forEach(se => se.sets.forEach(s => {
      const e = epley(s.weight, s.reps); if (!best || e >= best.e) best = { e: e, s: s, date: se.date };   // ties go to the more recent session
    }));
    if (!best || !(best.e > 0)) return null;
    return { state: 'start', weight: roundToStep(exr, best.e / (1 + target / 30)), reps: target,
      from: label + ' ' + fmtNum(best.s.weight) + ' × ' + best.s.reps + ' on ' + fmtDate(best.date) };
  };
  const mine = startFor(person, 'your');
  if (mine) return mine;
  const other = PEOPLE.find(p => p !== person);
  return other ? startFor(other, other + '’s') : null;
}
function hintHtml(exr, h, range) {
  range = range || PROGRAM;
  const last = h.last ? '<span class="muted">last</span> <b>' + (exr.weightType === 'bodyweight' ? loadText(exr, h.last.weight) : fmtNum(h.last.weight)) + ' × ' + h.last.reps.join(' / ') + '</b>' : '';
  if (h.state === 'start') return '<span class="start">Start around <b>' + fmtNum(h.weight) + ' kg</b></span><div class="tiny muted">From ' + esc(h.from) + '. Adjust if it feels off.</div>';
  if (h.state === 'ready') {
    let go;
    if (exr.inverted) go = 'Less help: ' + fmtNum(h.last.weight) + ' → ' + fmtNum(h.weight) + ' kg assist';
    else if (exr.weightType === 'bodyweight') go = 'Add load: ' + loadText(exr, h.weight);
    else if (exr.weightType === 'machine') go = 'Go up: +' + fmtNum(MACHINE_ADDONS[0]) + ' kg → ' + fmtNum(h.weight) + ' kg';
    else if (exr.weightType === 'dumbbell' || exr.weightType === 'kettlebell') go = 'Next size: ' + fmtNum(h.weight) + ' kg';
    else go = 'Go up to ' + fmtNum(h.weight) + ' kg';
    return last + '<br><span class="ready">✅ ' + go + '</span>';
  }
  if (h.state === 'low') return last + '<br><span class="low">⚠ Under ' + range.lo + ' on some sets — stay, or ease off a step</span>';
  return last + '<br><span class="hold">Stay at ' + loadText(exr, h.weight) + ' — aim for ' + range.hi + ' on every set</span>';
}
// "● Neil", or "●● Neil + Simon" when it applies to everyone
function whoHtml(people) {
  const one = p => '<span class="pdot dot-' + p.toLowerCase() + '">●</span>';
  if (people.length === 1) return one(people[0]) + '<b class="dot-' + people[0].toLowerCase() + '">' + people[0] + '</b>';
  return people.map((p, i) => '<span class="pdot dot-' + p.toLowerCase() + '"' + (i ? ' style="margin-left:-4px"' : '') + '>●</span>').join('') + '<b>' + people.join(' + ') + '</b>';
}
// the hint box on an exercise card; people with identical advice share one line
function coachBox(w, exr, people, range) {
  if (!hintable(exr)) return null;
  const hs = people.map(p => ({ p: p, h: progressionHint(exr, p, w.id, range) })).filter(x => x.h);
  if (!hs.length) return null;
  const keyOf = h => JSON.stringify([h.state, h.weight, h.last && h.last.weight, h.last && h.last.reps, h.from]);
  const groups = [];
  hs.forEach(x => { const g = groups.find(g => keyOf(g.h) === keyOf(x.h)); if (g) g.people.push(x.p); else groups.push({ h: x.h, people: [x.p] }); });
  const box = el('div', { class: 'coach' });
  groups.forEach(g => box.appendChild(el('div', { class: 'ln', html: whoHtml(g.people) + ' ' + hintHtml(exr, g.h, range) })));
  return box;
}

// ---- routines: a workout's routine, an exercise's target within it, and what this person already did today ----
function routineOf(w) { return (w && w.routineId) ? DB.Routines.find(r => r.id === w.routineId) : null; }
// An exercise swapped into a routine workout takes over the target of the routine exercise it
// replaced (extras and dropped items pair up in order); with nothing to replace it gets 3 × the default range.
function routineItem(w, exId) {
  const r = routineOf(w); if (!r) return null;
  const items = r.items || [];
  const own = items.find(i => i.exerciseId === exId);
  if (own) return own;
  const present = (w.plannedEx || []).slice();
  setsForWorkout(w.id).forEach(s => { if (!s.circuitId && !present.includes(s.exerciseId)) present.push(s.exerciseId); });
  const k = present.filter(id => !items.some(i => i.exerciseId === id)).indexOf(exId);
  if (k === -1) return null;
  const dropped = items.filter(i => !present.includes(i.exerciseId));
  return dropped[k] ? Object.assign({}, dropped[k], { exerciseId: exId }) : { exerciseId: exId, sets: 3, lo: PROGRAM.lo, hi: PROGRAM.hi };
}
function rangeFor(w, exId) {
  const it = routineItem(w, exId);
  return it ? { lo: Number(it.lo) || PROGRAM.lo, hi: Number(it.hi) || PROGRAM.hi } : PROGRAM;
}
// the rep range a routine gives this exercise (any routine), for places that aren't inside a workout
function anyRoutineRange(exId) {
  for (const r of DB.Routines) {
    if (r.deleted) continue;
    const it = (r.items || []).find(i => i.exerciseId === exId);
    if (it) return { lo: Number(it.lo) || PROGRAM.lo, hi: Number(it.hi) || PROGRAM.hi };
  }
  return null;
}
function todayLast(w, exId, person) {
  const mine = setsForWorkout(w.id).filter(s => s.exerciseId === exId && !s.circuitId && s.person === person)
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));
  return mine[mine.length - 1];
}

// who did the most recent set of this exercise in this workout: a person's name if only
// they did it, otherwise 'both' — so a one-person exercise stays one-person for the next set
function lastWhoFor(w, exId) {
  const sets = setsForWorkout(w.id).filter(s => s.exerciseId === exId && !s.circuitId);
  if (!sets.length) return 'both';
  const lastTs = Math.max.apply(null, sets.map(s => s.ts || 0));
  const people = Array.from(new Set(sets.filter(s => (s.ts || 0) === lastTs).map(s => s.person)));
  return people.length === 1 ? people[0] : 'both';
}

// ctx (optional) turns this into the circuit "change a station" editor, or the editor for one
// person's logged set:  { title, vals: {person: values}, split, who, fixed, onSave(valuesByPerson) }
function addSetModal(w, exercise, ctx) {
  const together = w.type === 'together';
  const onlyPerson = w.participants || 'Neil';          // the one person in a solo workout
  // who did this set: 'both' or a person's name (a skip is simply "the other person only")
  let who = (ctx && ctx.fixed) ? ctx.fixed
          : !together ? onlyPerson
          : ctx ? (ctx.who || 'both')
          : lastWhoFor(w, exercise.id);
  const isSprint = exercise.weightType === 'sprint';
  const bw = isBodyweight(exercise.weightType);
  const timed = isTimed(exercise.weightType);
  const cardio = isCardio(exercise.weightType);
  const schemeless = isSprint || bw || cardio || !!ctx;   // circuits have no Heavy/Light
  const range = rangeFor(w, exercise.id);   // this exercise's target range (a routine can set its own)
  let scheme = PROGRAM.scheme;       // new sets default to the 8–10 programme
  let showOld = false;               // reveal the Heavy 5 / Light 15 options
  let split = ctx ? !!ctx.split : false;
  let warmup = false;
  // working values per person
  const vals = ctx ? ctx.vals : {
    Neil:  pickStart(exercise, 'Neil'),
    Simon: pickStart(exercise, 'Simon'),
  };
  function pickStart(exr, p) {
    const other = p === 'Neil' ? 'Simon' : 'Neil';
    if (isSprint) {
      const ls = lastSet(exr.id, p) || lastSet(exr.id, other);
      return ls ? { duration: Number(ls.duration) || 15, rest: Number(ls.rest) || 30, number: Number(ls.number) || 4 }
                : { duration: 15, rest: 30, number: 4 };
    }
    if (bw) {
      const td = todayLast(w, exr.id, p);
      if (td) return { weight: Number(td.weight), reps: Number(td.reps), loadType: 'plate' };
      const h = timed ? null : progressionHint(exr, p, w.id, range);   // push-ups etc. progress by adding load
      if (h && h.weight !== undefined) return { weight: h.weight, reps: range.lo, loadType: 'plate' };
      const ls = lastSet(exr.id, p) || lastSet(exr.id, other);
      return { weight: ls ? Number(ls.weight) : 0, reps: ls ? Number(ls.reps) : (timed ? 30 : 10), loadType: 'plate' };
    }
    if (cardio) {
      const ls = lastSet(exr.id, p) || lastSet(exr.id, other);
      const dur = ls ? Number(ls.duration) : 600;
      return Object.assign({ durMin: Math.floor(dur / 60), durSec: dur % 60, setting: ls ? Number(ls.weight) : 1 },
        hasGradient(exr.weightType) ? { gradient: ls ? (Number(ls.gradient) || 0) : 0 } : {});
    }
    if (scheme === PROGRAM.scheme) {
      // 1. carry on from what this person already did today on this exercise
      const today = todayLast(w, exr.id, p);
      if (today) return { weight: Number(today.weight), reps: Number(today.reps) };
      // 2. otherwise the progression hint: today's target weight, and a sensible first rep count
      const h = progressionHint(exr, p, w.id, range);
      if (h && h.weight) return { weight: h.weight, reps: range.lo };
    }
    // prefer the last time at THIS scheme (heavy/light differ a lot), then any history
    const ls = lastSet(exr.id, p, scheme) || lastSet(exr.id, other, scheme)
            || lastSet(exr.id, p) || lastSet(exr.id, other);
    return { weight: ls ? Number(ls.weight) : defaultWeight(exr), reps: scheme === PROGRAM.scheme ? range.lo : scheme };
  }

  const m = $('#modal');
  function draw() {
    m.innerHTML = '';
    m.appendChild(el('h3', { text: ctx ? ctx.title : ((isSprint ? 'Add sprints · ' : 'Add set · ') + exercise.name) }));

    // who did this? (together-workouts only) — pick one person if the other sat it out
    if (together && !(ctx && ctx.fixed)) {

    }

    // rep scheme — 8–10 is the programme; Heavy 5 / Light 15 are tucked behind a link.
    // (not relevant for sprints, bodyweight or cardio)
    if (!schemeless) {
      const pick = s => { scheme = s; vals.Neil = pickStart(exercise, 'Neil'); vals.Simon = pickStart(exercise, 'Simon'); draw(); };
      if (scheme === PROGRAM.scheme && !showOld) {
        m.appendChild(el('div', { class: 'seg fill', style: 'margin-bottom:6px' }, [el('button', { class: 'on', text: SCHEMES[PROGRAM.scheme] })]));
        m.appendChild(el('div', { class: 'tiny muted', style: 'text-align:right;margin-bottom:12px;cursor:pointer', text: 'Heavy 5 / Light 15 instead',
          onclick: () => { showOld = true; draw(); } }));

        m.appendChild(el('div', { class: 'seg fill', style: 'margin-bottom:14px' }, [PROGRAM.scheme, 5, 15].map(s =>
          el('button', { class: scheme === s ? 'on' : '', text: SCHEMES[s], onclick: () => pick(s) }))));
      }
    }

    if (together && who === 'both') {

      ]));

    if (who !== 'both') {
      m.appendChild(personEntry(exercise, who, vals[who], false));
    } else if (!split) {
      // one entry that applies to both (use Neil's vals as the shared value)
      m.appendChild(personEntry(exercise, null, vals.Neil, false));
    } else {
      PEOPLE.forEach(p => m.appendChild(personEntry(exercise, p, vals[p], true)));
    }

    // warm-up flag — warm-up sets are excluded from Progress (not offered for circuit stations)

      m.appendChild(el('label', { class: 'checkline', style: 'border:none;margin-top:8px' }, [

        el('span', { class: 'tiny muted', text: 'excluded from Progress' }),
      ]));
    }

    const actions = el('div', { class: 'row', style: 'margin-top:14px;gap:10px' }, [
      el('button', { class: 'btn ghost', style: 'flex:1', text: ctx ? 'Cancel' : 'Close', onclick: closeModal }),
      el('button', { class: 'btn', style: 'flex:2', text: ctx ? 'Done' : 'Save set', onclick: doSave }),
    ]);
    m.appendChild(actions);
  }

  // preset chips + manual stepper, used for sprint duration/rest/number
  function chipStepper(v, key, presets, unit, step) {
    const box = el('div');
    box.appendChild(el('div', { class: 'seg fill', style: 'flex-wrap:wrap;margin-bottom:6px' },
      presets.map(p => el('button', { class: (Number(v[key]) === p ? 'on' : ''), text: p + unit, onclick: () => { v[key] = p; draw(); } }))));
    box.appendChild(stepperControl(v, key, step, 1));

      wrap.appendChild(el('div', { class: 'seg fill', style: 'margin-bottom:8px' }, [
        el('button', { class: (v.weight > 0 ? '' : 'on'), text: 'Bodyweight', onclick: () => { v.weight = 0; draw(); } }),
        el('button', { class: (v.weight > 0 ? 'on' : ''), text: '+ Added load', onclick: () => { if (!(v.weight > 0)) v.weight = (v.loadType === 'dumbbell' ? DUMBBELLS[2] : v.loadType === 'kettlebell' ? KETTLEBELLS[2] : 2.5); draw(); } }),
      ]));

        wrap.appendChild(el('div', { class: 'seg fill', style: 'margin-bottom:6px' }, [['plate', 'Plate'], ['dumbbell', 'DB'], ['kettlebell', 'KB']].map(t =>
          el('button', { class: (v.loadType === t[0] ? 'on' : ''), text: t[1], onclick: () => {
            v.loadType = t[0];

        wrap.appendChild(el('div', { class: 'small muted', text: 'Added weight (kg)' }));
        wrap.appendChild(weightControl({ weightType: v.loadType, step: 2.5 }, v));

      wrap.appendChild(stepperControl(v, 'setting', 0.1, 0));

        wrap.appendChild(el('div', { class: 'small muted', style: 'margin-top:12px', text: 'Gradient (%)' }));
        wrap.appendChild(stepperControl(v, 'gradient', 0.5, 0));

      wrap.appendChild(el('div', { class: 'small muted', text: 'Weight (kg)' }));
      wrap.appendChild(weightControl(exr, v));
      wrap.appendChild(el('div', { class: 'small muted', style: 'margin-top:12px', text: 'Reps' }));
      wrap.appendChild(stepperControl(v, 'reps', 1, 0));
    }
    return wrap;
  }

  function doSave() {
    if (ctx) {
      // circuit station: hand the chosen values back instead of creating sets
      const out = {};
      if (who !== 'both') out[who] = vals[who];
      else if (!split) PEOPLE.forEach(p => { out[p] = Object.assign({}, vals.Neil); });
      else PEOPLE.forEach(p => { out[p] = vals[p]; });
      closeModal(); ctx.onSave(out);
      return;
    }
    const ts = Date.now();
    function makeSet(person, v) {
      return buildSetRow(exercise, v, { id: uid(), workoutId: w.id, exerciseId: exercise.id, person, ts, warmup: warmup, scheme: scheme, deleted: false, updated: 0 });
    }
    let toAdd = [];
    if (who !== 'both') toAdd = [makeSet(who, vals[who])];
    else if (!split) toAdd = PEOPLE.map(p => makeSet(p, vals.Neil));
    else toAdd = PEOPLE.map(p => makeSet(p, vals[p]));
    toAdd.forEach(s => upsert('Sets', s));
    // make sure exercise is part of the planned list so it shows
    if (!(w.plannedEx || []).includes(exercise.id)) { w.plannedEx = (w.plannedEx || []).concat(exercise.id); upsert('Workouts', w); }
    if (w.status === 'planned') { /* leave as planned until user finishes */ }
    closeModal(); renderLog(); toast('Set saved');
  }

  draw();
  openModal();
}

function defaultWeight(exr) {
  if (exr.weightType === 'dumbbell') return DUMBBELLS[4];
  if (exr.weightType === 'kettlebell') return KETTLEBELLS[3];
  return exr.weightType === 'machine' ? 20 : 20;
}
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

// weight control varies by exercise type
function weightControl(exr, v) {
  if (exr.weightType === 'dumbbell' || exr.weightType === 'kettlebell') {
    const opts = exr.weightType === 'dumbbell' ? DUMBBELLS : KETTLEBELLS;
    if (!opts.includes(v.weight)) v.weight = nearest(opts, v.weight);
    const sel = el('select', { onchange: e => { v.weight = Number(e.target.value); } },
      opts.map(o => el('option', { value: o, text: o + ' kg' + (exr.weightType === 'dumbbell' ? ' (each)' : '') })));
    sel.value = String(v.weight);
    return sel;
  }
  // plate / machine: stepper
  const wrapper = el('div');
  wrapper.appendChild(stepperControl(v, 'weight', exr.step || 2.5, 0));
  if (exr.weightType === 'machine') {
    const micro = el('div', { class: 'micro' });
    MACHINE_ADDONS.forEach(a => micro.appendChild(el('button', { text: '+' + a, onclick: () => { v.weight = round2(v.weight + a); refreshStepper(wrapper, v, 'weight'); } })));
    MACHINE_ADDONS.forEach(a => micro.appendChild(el('button', { text: '−' + a, onclick: () => { v.weight = Math.max(0, round2(v.weight - a)); refreshStepper(wrapper, v, 'weight'); } })));
    wrapper.appendChild(micro);
  }
  return wrapper;
}
function nearest(arr, x) { return arr.reduce((p, c) => Math.abs(c - x) < Math.abs(p - x) ? c : p, arr[0]); }

function stepperControl(obj, key, step, min) {
  const input = el('input', { type: 'number', value: fmtNum(obj[key]), inputmode: 'decimal', step: step });
  input.addEventListener('change', () => { obj[key] = Math.max(min, Number(input.value) || 0); input.value = fmtNum(obj[key]); });
  const dec = el('button', { text: '−', onclick: () => { obj[key] = Math.max(min, round2(obj[key] - step)); input.value = fmtNum(obj[key]); } });
  const inc = el('button', { text: '+', onclick: () => { obj[key] = round2(obj[key] + step); input.value = fmtNum(obj[key]); } });
  const wrap = el('div', { class: 'stepper' }, [dec, input, inc]);
  wrap._input = input; wrap._key = key;
  return wrap;
}
function refreshStepper(wrapper, obj, key) {
  const input = wrapper.querySelector('.stepper input');
  if (input) input.value = fmtNum(obj[key]);
}

// ---- add exercise into a workout (from library / planning) ----
function addExerciseToWorkout(w) {
  const chosen = new Set(w.plannedEx || []);
  const m = $('#modal');
  m.innerHTML = '';
  m.appendChild(el('h3', { text: 'Add exercises' }));
  // save whatever is ticked (keeping existing order, appending new picks) and close
  function commit() {
    const ordered = (w.plannedEx || []).filter(id => chosen.has(id));
    chosen.forEach(id => { if (!ordered.includes(id)) ordered.push(id); });
    // stamp the just-added ones with one shared time so they sort to the top
    // together (newest batch first) while keeping their picked order
    const stamp = Date.now();
    ADDED[w.id] = ADDED[w.id] || {};
    ordered.forEach(id => { if (ADDED[w.id][id] === undefined) ADDED[w.id][id] = stamp; });
    w.plannedEx = ordered; upsert('Workouts', w); save(); closeModal(); renderLog();
  }
  // straight to a circuit without having to press Done first; ticked exercises are kept
  m.appendChild(el('button', { class: 'btn block ghost', style: 'margin-bottom:4px', text: '🔁 Add a circuit instead', onclick: () => { commit(); addCircuitModal(w); } }));
  const listWrap = el('div');
  byCategory().forEach(([cat, items]) => {
    listWrap.appendChild(el('h2', { class: 'section', text: cat }));
    items.forEach(e => {
      const cb = el('input', { type: 'checkbox' }); cb.checked = chosen.has(e.id);
      cb.addEventListener('change', () => { if (cb.checked) chosen.add(e.id); else chosen.delete(e.id); });
      listWrap.appendChild(el('label', { class: 'checkline' }, [cb, el('span', { text: e.name }), el('span', { class: 'spacer' }), el('span', { class: 'tiny muted', text: e.weightType })]));
    });
  });
  m.appendChild(listWrap);
  m.appendChild(el('button', { class: 'btn block', style: 'margin-top:8px', text: '+ Create brand-new exercise', onclick: () => exerciseModal(null, (newId) => { chosen.add(newId); addExerciseToWorkout(w); }) }));
  m.appendChild(el('div', { class: 'row', style: 'margin-top:16px;gap:10px' }, [
    el('button', { class: 'btn ghost', style: 'flex:1', text: 'Cancel', onclick: closeModal }),
    el('button', { class: 'btn', style: 'flex:2', text: 'Done', onclick: commit }),
  ]));
  openModal();
}
function byCategory() {
  const cats = {};
  DB.Exercises.filter(e => !e.archived).sort((a, b) => (a.sortOrder - b.sortOrder) || a.name.localeCompare(b.name))
    .forEach(e => { (cats[e.category || 'Other'] = cats[e.category || 'Other'] || []).push(e); });
  return Object.keys(cats).sort().map(c => [c, cats[c]]);
}

// ---- DASHBOARD ----
// circuits with at least one logged round, grouped by their ordered stations
function circuitGroups() {
  const map = {};
  DB.Workouts.filter(w => !w.deleted).forEach(w => (w.circuits || []).forEach(c => {
    if (!circuitSets(w, c).length) return;
    const k = circuitKey(c), dt = dateKey(w.date);
    if (!map[k] || dt >= map[k].latest) map[k] = { key: k, name: circuitName(c), latest: dt, n: (c.stations || []).length };
  }));
  const groups = Object.keys(map).map(k => map[k]);
  // two variants of a circuit can share a name (e.g. one gained a station): tell them apart
  const seen = {};
  groups.forEach(g => { seen[g.name] = (seen[g.name] || 0) + 1; });
  groups.forEach(g => { if (seen[g.name] > 1) g.name += ' (' + g.n + ' exercises)'; });
  return groups.sort((a, b) => a.name.localeCompare(b.name));
}
// the circuit key when the Progress dropdown is on a circuit, else null
function dashCircuitKey() { const v = UI.dashExerciseId || ''; return v.indexOf('circ:') === 0 ? v.slice(5) : null; }

function renderDash() {
  const active = DB.Exercises.filter(e => !e.archived).sort((a, b) => a.name.localeCompare(b.name));
  const circs = circuitGroups();
  const sel = $('#dashExercise');
  sel.innerHTML = '';
  active.forEach(e => sel.appendChild(el('option', { value: e.id, text: e.name })));
  if (!active.length) { sel.appendChild(el('option', { text: 'No exercises' })); }
  if (circs.length) {
    const og = el('optgroup', { label: 'Circuits' });
    circs.forEach(g => og.appendChild(el('option', { value: 'circ:' + g.key, text: '🔁 ' + g.name })));
    sel.appendChild(og);
  }
  const ck = dashCircuitKey();
  const valid = ck ? circs.some(g => g.key === ck) : active.some(e => e.id === UI.dashExerciseId);
  if (!UI.dashExerciseId || !valid) UI.dashExerciseId = active[0] && active[0].id;
  sel.value = UI.dashExerciseId || '';
  renderProgress();
}
function renderProgress() {
  const ck = dashCircuitKey();
  const exr = ck ? null : exById(UI.dashExerciseId);
  $('#dashSchemeRow').style.display = (ck || isSchemeless(exr)) ? 'none' : '';
  $('#trendTitle').textContent = ck ? 'Rounds per session' : 'Volume trend';
  renderHistory();
  drawVolChart();
}

// ---- history helpers ----
function workoutDate(s) { const w = workoutById(s.workoutId); return dateKey((w && w.date) || new Date(s.ts).toISOString().slice(0, 10)); }
function setsFor(exId, person, scheme) {
  return DB.Sets.filter(s => s.exerciseId === exId && s.person === person && !s.deleted && !s.warmup && !s.circuitId
      && (scheme === undefined || Number(s.scheme) === Number(scheme)))
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));
}
function sessionsByDate(exId, person, scheme) {
  const byDate = {};
  setsFor(exId, person, scheme).forEach(s => { const d = workoutDate(s); (byDate[d] = byDate[d] || []).push(s); });
  return byDate;
}
function volOf(grp) { return grp.reduce((t, s) => t + Number(s.weight) * Number(s.reps), 0); }
function secsOf(grp) { return grp.reduce((t, s) => t + Number(s.number) * Number(s.duration), 0); }
// full session breakdown, e.g. "100×5  /  100×5  /  100×5"
function setListHtml(grp, exr) {
  const t = exr ? exr.weightType : '';
  return grp.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).map(s => {
    if (t === 'sprint') return '<b>' + fmtNum(s.number) + '</b>×' + fmtNum(s.duration) + 's';
    if (isCardio(t)) return '<b>' + fmtMMSS(s.duration) + '</b>@' + fmtNum(s.weight) + (hasGradient(t) && fmtGradient(s) ? ' ↗' + fmtGradient(s) : '');
    if (isBodyweight(t)) {
      const base = Number(s.weight) > 0 ? ('BW+' + fmtNum(s.weight)) : 'BW';
      return isTimed(t) ? ('<b>' + base + '</b>·' + fmtNum(s.reps) + 's') : ('<b>' + base + '</b>×' + s.reps);
    }
    return '<b>' + fmtNum(s.weight) + '</b>×' + s.reps;
  }).join('  /  ');
}
function personHeader(p) {
  const pl = p.toLowerCase();
  return el('div', { html: '<span class="pdot dot-' + pl + '">●</span><b class="dot-' + pl + '">' + p + '</b>' });
}

// ---- History (the headline of the Progress tab) ----
// every logged session of one circuit (matched by its ordered stations) for one person
function circuitSessions(key, person) {
  const out = [];
  DB.Workouts.filter(w => !w.deleted).forEach(w => (w.circuits || []).forEach(c => {
    if (circuitKey(c) !== key) return;
    const by = {};
    circuitSets(w, c).filter(s => s.person === person && !s.warmup).forEach(s => { (by[s.round] = by[s.round] || []).push(s); });
    const ns = Object.keys(by).map(Number).sort((a, b) => a - b);
    if (!ns.length) return;
    out.push({ date: dateKey(w.date), at: c.at || 0, rounds: ns.map(n => by[n].slice().sort((a, b) => (a.ts || 0) - (b.ts || 0))) });
  }));
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
}
function circuitSessionHtml(label, sess, extra) {
  const lines = sess.rounds.map((sets, i) => 'R' + (i + 1) + '  ' + sets.map(s => {
    const exr = exById(s.exerciseId);
    return '<span class="muted">' + esc(exr ? exr.name : '?') + '</span> ' + setListHtml([s], exr);
  }).join(' <span class="muted">·</span> '));
  return '<span class="muted">' + label + '</span> <span class="muted tiny">' + fmtDate(sess.date) + ' · ' + sess.rounds.length + ' round' + (sess.rounds.length === 1 ? '' : 's') + (extra || '') + '</span><br>' + lines.join('<br>');
}
function circuitHistoryCard(key) {
  const g = circuitGroups().find(x => x.key === key);
  const card = el('div', { class: 'card' });
  card.appendChild(el('strong', { text: '🔁 ' + (g ? g.name : 'Circuit') }));
  PEOPLE.forEach(p => {
    const block = el('div', { class: 'exrow' }, [el('div', { class: 'grow' }, [personHeader(p)])]);
    const info = block.firstChild;
    const sess = circuitSessions(key, p);
    if (!sess.length) info.appendChild(el('div', { class: 'small muted', text: 'No rounds yet' }));
    else {
      const last = sess[sess.length - 1];
      let best = sess[0];
      sess.forEach(s => { if (s.rounds.length >= best.rounds.length) best = s; });   // most rounds; a tie goes to the later one
      info.appendChild(el('div', { class: 'small', html: circuitSessionHtml('Last Session:', last) }));
      info.appendChild(el('div', { class: 'small', style: 'margin-top:5px', html: circuitSessionHtml('Best Effort:', best) }));
    }
    card.appendChild(block);
  });
  return card;
}

function renderHistory() {
  const box = $('#historyBox'); box.innerHTML = '';
  const ck = dashCircuitKey();
  if (ck) { box.appendChild(circuitHistoryCard(ck)); return; }
  const exr = exById(UI.dashExerciseId);
  if (!exr) { box.appendChild(el('div', { class: 'empty', text: 'No exercise selected.' })); return; }
  if (exr.weightType === 'sprint') { box.appendChild(sprintHistoryCard(exr)); return; }
  if (isCardio(exr.weightType)) { box.appendChild(cardioHistoryCard(exr)); return; }
  if (isBodyweight(exr.weightType)) { box.appendChild(bodyweightHistoryCard(exr)); return; }
  // the current programme first; the Heavy 5 / Light 15 history is kept, tucked underneath
  box.appendChild(historyCard(exr, PROGRAM.scheme, 'Current programme'));
  const hasCur = PEOPLE.some(p => setsFor(exr.id, p, PROGRAM.scheme).length);
  const hasOld = [5, 15].some(sc => PEOPLE.some(p => setsFor(exr.id, p, sc).length));
  if (hasOld) {
    // open by default when there's nothing at the new range yet, so older history is never hidden
    const open = UI.showEarlier === null ? !hasCur : UI.showEarlier;
    box.appendChild(el('div', { class: 'card tappable', onclick: () => { UI.showEarlier = !open; renderHistory(); } }, [
      el('div', { class: 'row' }, [el('strong', { class: 'muted', text: 'Earlier — Heavy 5 & Light 15' }), el('span', { class: 'spacer' }),
        el('span', { class: 'tiny muted', text: open ? 'hide ▾' : 'show ▸' })]) ]));
    if (open) [[5, 'Heavy · 5 reps'], [15, 'Light · 15 reps']].forEach(s => box.appendChild(historyCard(exr, s[0], s[1])));
  }
}
function historyBlock(p, byDate, opts) {
  const block = el('div', { class: 'exrow' }, [el('div', { class: 'grow' }, [personHeader(p)])]);
  const info = block.firstChild;
  const dates = Object.keys(byDate);
  if (!dates.length) { info.appendChild(el('div', Object.assign({ class: 'small muted' }, opts.emptyHtml ? { html: opts.emptyHtml } : { text: opts.empty }))); return block; }
  const lastDate = dates.slice().sort()[dates.length - 1];
  let bestDate = dates[0];
  dates.forEach(d => { if (opts.score(byDate[d]) > opts.score(byDate[bestDate])) bestDate = d; });
  info.appendChild(el('div', { class: 'small', html:
    '<span class="muted">Last Session:</span> <span class="muted tiny">' + fmtDate(lastDate) + '</span><br>' + setListHtml(byDate[lastDate], opts.exr) }));
  info.appendChild(el('div', { class: 'small', style: 'margin-top:5px', html:
    '<span class="muted">Best Effort:</span> <span class="muted tiny">' + fmtDate(bestDate) + ' · ' + opts.bestNote(byDate[bestDate]) + '</span><br>' + setListHtml(byDate[bestDate], opts.exr) }));
  return block;
}
function historyCard(exr, scheme, label) {
  const card = el('div', { class: 'card' });
  card.appendChild(el('strong', { text: label }));
  PEOPLE.forEach(p => {
    let empty = 'No ' + (scheme === 5 ? 'heavy' : 'light') + ' sets yet', emptyHtml = null;
    if (scheme === PROGRAM.scheme) {
      // nothing at the new range yet: show where to start
      const h = progressionHint(exr, p, null, anyRoutineRange(exr.id));
      empty = 'No sessions yet';
      if (h && h.state === 'start') emptyHtml = 'No sessions yet — <span class="start" style="color:#7dd3fc;font-weight:700">start ~' + fmtNum(h.weight) + ' kg</span> <span class="tiny">(from ' + esc(h.from) + ')</span>';
    }
    card.appendChild(historyBlock(p, sessionsByDate(exr.id, p, scheme), {
      empty: empty, emptyHtml: emptyHtml,
      exr: exr,
      score: volOf,
      bestNote: grp => volOf(grp).toLocaleString() + ' kg',
    }));
  });
  return card;
}
function sprintHistoryCard(exr) {
  const card = el('div', { class: 'card' });
  card.appendChild(el('strong', { text: 'Sprints' }));
  PEOPLE.forEach(p => card.appendChild(historyBlock(p, sessionsByDate(exr.id, p), {
    empty: 'No sprints yet',
    exr: exr,
    score: secsOf,
    bestNote: grp => secsOf(grp) + 's total',
  })));
  return card;
}
function cardioHistoryCard(exr) {
  const score = grp => grp.reduce((t, s) => t + cardioEffort(s), 0); // total minutes×setting
  const card = el('div', { class: 'card' });
  card.appendChild(el('strong', { text: 'Cardio' }));
  PEOPLE.forEach(p => card.appendChild(historyBlock(p, sessionsByDate(exr.id, p), {
    empty: 'No sessions yet',
    exr: exr,
    score: score,
    bestNote: grp => Math.round(score(grp)) + ' effort (min×setting)',
  })));
  return card;
}
function bodyweightHistoryCard(exr) {
  const timedT = isTimed(exr.weightType);
  const score = grp => grp.reduce((t, s) => t + Number(s.reps), 0); // total reps (or total seconds)
  const card = el('div', { class: 'card' });
  card.appendChild(el('strong', { text: timedT ? 'Hold time' : 'Reps' }));
  PEOPLE.forEach(p => card.appendChild(historyBlock(p, sessionsByDate(exr.id, p), {
    empty: 'No sets yet',
    exr: exr,
    score: score,
    bestNote: grp => score(grp) + (timedT ? 's total' : ' reps total'),
  })));
  return card;
}
function drawVolChart() {
  if (charts.vol) { charts.vol.destroy(); charts.vol = null; }
  const ck = dashCircuitKey();
  if (ck) {
    // circuits: rounds completed per session
    const roundsMap = {};
    PEOPLE.forEach(p => circuitSessions(ck, p).forEach(s => {
      roundsMap[s.date] = roundsMap[s.date] || {};
      roundsMap[s.date][p] = (roundsMap[s.date][p] || 0) + s.rounds.length;
    }));
    const cdates = Object.keys(roundsMap).sort();
    const ccolors = { Neil: getCss('--neil'), Simon: getCss('--simon') };
    charts.vol = new Chart($('#chartVol'), {
      type: 'line',
      data: { labels: cdates.map(d => fmtDate(d)), datasets: PEOPLE.map(p => ({
        label: p, borderColor: ccolors[p], backgroundColor: ccolors[p],
        spanGaps: true, tension: .25, pointRadius: 3,
        data: cdates.map(d => roundsMap[d] && roundsMap[d][p] !== undefined ? roundsMap[d][p] : null),
      })) },
      options: lineOpts(),
    });
    return;
  }
  const exr = exById(UI.dashExerciseId);
  if (!exr) return;
  const sprint = exr.weightType === 'sprint';
  const bw = isBodyweight(exr.weightType);
  const cardio = isCardio(exr.weightType);
  let sets = DB.Sets.filter(s => s.exerciseId === exr.id && !s.deleted && !s.warmup && !s.circuitId);
  if (!isSchemeless(exr) && UI.dashScheme !== 'all') sets = sets.filter(s => Number(s.scheme) === Number(UI.dashScheme));
  const volMap = {};
  sets.forEach(s => {
    const d = workoutDate(s);
    const vol = sprint ? (Number(s.number) || 0) * (Number(s.duration) || 0)
              : cardio ? cardioEffort(s)
              : bw ? (Number(s.reps) || 0)
              : Number(s.weight) * Number(s.reps);
    volMap[d] = volMap[d] || {};
    volMap[d][s.person] = (volMap[d][s.person] || 0) + vol;
  });
  const dates = Object.keys(volMap).sort();
  const labels = dates.map(d => fmtDate(d));
  const colors = { Neil: getCss('--neil'), Simon: getCss('--simon') };
  charts.vol = new Chart($('#chartVol'), {
    type: 'line',
    data: { labels, datasets: PEOPLE.map(p => ({
      label: p, borderColor: colors[p], backgroundColor: colors[p],
      spanGaps: true, tension: .25, pointRadius: 3,
      data: dates.map(d => volMap[d] && volMap[d][p] !== undefined ? Math.round(volMap[d][p]) : null),
    })) },
    options: lineOpts(),
  });
}
function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function lineOpts() {
  const grid = 'rgba(148,163,184,.15)', tick = getCss('--muted');
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: getCss('--text'), usePointStyle: true, boxWidth: 8 } } },
    scales: {
      x: { grid: { color: grid }, ticks: { color: tick, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
      y: { grid: { color: grid }, ticks: { color: tick }, beginAtZero: false },
    },
  };
}

// ---- EXERCISES ----
function renderExercises() {
  const list = $('#exerciseList'); const arch = $('#exerciseArchived');
  list.innerHTML = ''; arch.innerHTML = '';
  byCategory().forEach(([cat, items]) => {
    const c = el('div', { class: 'card' });
    c.appendChild(el('div', { class: 'small muted', style: 'margin-bottom:4px', text: cat }));
    items.forEach(e => c.appendChild(exerciseRow(e)));
    list.appendChild(c);
  });
  // don't show dedupe leftovers: an archived copy whose name is still active
  const activeNames = new Set(DB.Exercises.filter(e => !e.archived).map(e => (e.name || '').trim().toLowerCase()));
  const archived = DB.Exercises.filter(e => e.archived && !activeNames.has((e.name || '').trim().toLowerCase()));
  if (!archived.length) arch.appendChild(el('div', { class: 'small muted', text: 'Nothing archived.' }));
  else { const c = el('div', { class: 'card' }); archived.forEach(e => c.appendChild(exerciseRow(e))); arch.appendChild(c); }
}
function exerciseRow(e) {
  return el('div', { class: 'exrow' }, [
    el('div', { class: 'grow' }, [
      el('div', { text: e.name }),
      el('div', { class: 'tiny muted', text: e.weightType + ' · ' + (e.category || '—') + (e.inverted ? ' · inverted' : '') }),
    ]),
    el('button', { class: 'btn sm ghost', text: 'Edit', onclick: () => exerciseModal(e) }),
  ]);
}
function exerciseModal(existing, onCreate) {
  const e = existing || { id: uid(), name: '', weightType: 'plate', category: 'Chest', step: 2.5, inverted: false, archived: false, sortOrder: DB.Exercises.length, updated: 0 };
  const m = $('#modal'); m.innerHTML = '';
  m.appendChild(el('h3', { text: existing ? 'Edit exercise' : 'New exercise' }));

  const name = el('input', { type: 'text', placeholder: 'e.g. Cable row', value: e.name });
  m.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Name' }), name]));

  const cats = ['Chest', 'Back', 'Shoulders', 'Arms', 'Legs', 'Core', 'Cardio', 'Mobility', 'Other'];
  const catSel = el('select', {}, cats.map(c => el('option', { value: c, text: c }))); catSel.value = e.category || 'Chest';
  m.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Category' }), catSel]));

  const types = [['plate', 'Plate-loaded / barbell (±2.5 kg)'], ['machine', 'Machine stack (+micro plates)'], ['dumbbell', 'Dumbbell singles'], ['kettlebell', 'Kettlebell'], ['sprint', 'Sprints (duration / rest / number)'], ['bodyweight', 'Bodyweight — reps (+ optional load)'], ['bodyweight_time', 'Bodyweight — hold time (+ optional load)'], ['cardio', 'Cardio machine (duration + setting)'], ['cardio_gradient', 'Cardio machine + gradient (e.g. treadmill)']];
  const typeSel = el('select', {}, types.map(t => el('option', { value: t[0], text: t[1] }))); typeSel.value = e.weightType;
  m.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Type' }), typeSel]));

  const step = el('input', { type: 'number', value: e.step, step: 0.25, inputmode: 'decimal' });
  const stepField = el('label', { class: 'field' }, [el('span', { text: '± step for + / − buttons (kg)' }), step]);
  m.appendChild(stepField);

  let inverted = !!e.inverted;
  const invBtn = el('button', { class: 'btn sm ' + (inverted ? '' : 'ghost'), text: inverted ? 'Inverted: ON' : 'Inverted: off', onclick: () => { inverted = !inverted; invBtn.textContent = inverted ? 'Inverted: ON' : 'Inverted: off'; invBtn.className = 'btn sm ' + (inverted ? '' : 'ghost'); } });
  const invField = el('label', { class: 'field' }, [el('span', { text: 'Inverted (more weight = easier, e.g. assisted pull-ups)' }), invBtn]);
  m.appendChild(invField);

  // show only the fields that make sense for the chosen type
  function syncTypeVis() {
    stepField.style.display = (typeSel.value === 'plate' || typeSel.value === 'machine') ? '' : 'none';
    invField.style.display = (typeSel.value === 'sprint' || isBodyweight(typeSel.value) || isCardio(typeSel.value)) ? 'none' : '';
  }
  typeSel.addEventListener('change', syncTypeVis); syncTypeVis();

  const actions = el('div', { class: 'row', style: 'gap:10px;margin-top:6px' });
  if (existing) actions.appendChild(el('button', { class: 'btn danger sm', text: e.archived ? 'Unarchive' : 'Archive', onclick: () => { e.archived = !e.archived; upsert('Exercises', e); closeModal(); renderExercises(); } }));
  actions.appendChild(el('span', { class: 'spacer' }));
  actions.appendChild(el('button', { class: 'btn ghost', text: 'Cancel', onclick: closeModal }));
  actions.appendChild(el('button', { class: 'btn', text: 'Save', onclick: () => {
    if (!name.value.trim()) { toast('Name required'); return; }
    e.name = name.value.trim(); e.category = catSel.value; e.weightType = typeSel.value;
    e.step = Number(step.value) || 2.5; e.inverted = inverted;
    upsert('Exercises', e); closeModal();
    if (onCreate && !existing) onCreate(e.id); else rerenderActive();
  } }));
  m.appendChild(actions);
  openModal();
}

// ---- SETTINGS ----
function settingsModal() {
  const m = $('#modal'); m.innerHTML = '';
  m.appendChild(el('h3', { text: 'Settings' }));
  const url = el('input', { type: 'text', placeholder: 'https://script.google.com/.../exec', value: CFG.scriptUrl });
  m.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Google Apps Script web-app URL' }), url]));
  m.appendChild(el('div', { class: 'small muted', html: 'Paste the <b>/exec</b> URL from your deployed Apps Script. Leave blank to stay local-only. See <b>README.md</b> for setup.' }));

  m.appendChild(el('div', { class: 'row', style: 'gap:10px;margin-top:16px' }, [
    el('button', { class: 'btn ghost', style: 'flex:1', text: 'Pull from Sheet', onclick: async () => { CFG.scriptUrl = url.value.trim(); save(); toast('Pulling…'); await pullAll(); toast('Done'); } }),
    el('button', { class: 'btn', style: 'flex:1', text: 'Save', onclick: () => { CFG.scriptUrl = url.value.trim(); save(); scheduleSync(); closeModal(); syncNow(); } }),
  ]));

  m.appendChild(el('h2', { class: 'section', text: 'Data' }));
  m.appendChild(el('div', { class: 'small muted', text: DB.Exercises.length + ' exercises · ' + DB.Workouts.filter(w=>!w.deleted).length + ' workouts · ' + DB.Sets.filter(s=>!s.deleted).length + ' sets · ' + QUEUE.length + ' queued' }));
  m.appendChild(el('button', { class: 'btn ghost sm block', style: 'margin-top:10px', text: 'Force sync now', onclick: () => { syncNow(); toast('Syncing…'); } }));
  openModal();
}

// ---- modal plumbing ----
function openModal() { $('#modalBg').classList.add('open'); }
function closeModal() { $('#modalBg').classList.remove('open'); }
$('#modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }

// ---- events ----
$all('nav.tabs button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
$('#btnNewWorkout').addEventListener('click', () => newWorkoutModal());
$('#btnNewRoutine').addEventListener('click', () => routineModal());
$('#btnNewExercise').addEventListener('click', () => exerciseModal());
$('#btnSettings').addEventListener('click', settingsModal);
$('#dashExercise').addEventListener('change', e => { UI.dashExerciseId = e.target.value; UI.showEarlier = null; renderProgress(); });
$all('#dashScheme button').forEach(b => b.addEventListener('click', () => { UI.dashScheme = b.dataset.s; $all('#dashScheme button').forEach(x => x.classList.toggle('on', x === b)); drawVolChart(); }));
window.addEventListener('online', () => { setSync('pending'); syncNow(); });
window.addEventListener('offline', () => setSync('err', 'Offline'));

// ---- service worker (offline app shell) ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ---- boot ----
load();
switchTab('plan');
scheduleSync();
if (CFG.scriptUrl) syncNow();
preloadAvatars().then(ok => { if (ok) rerenderActive(); });
</script>
